name: Build Free-Threading Wheels

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_wheels:
    name: Build cp314t/cp315/cp315t wheels on Linux
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cibuildwheel
        # exact pin: release wheels must be reproducible
        run: python -m pip install "cibuildwheel==4.3.5"

      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          # Free-threaded 3.14/3.15 plus regular 3.15 (granian-python 3.15 base)
          # (cibuildwheel 4 builds free-threaded interpreters by default; the 3.x
          # CIBW_ENABLE=cpython-freethreading group no longer exists)
          CIBW_BUILD: "cp314t-* cp315-* cp315t-*"
          CIBW_ARCHS_LINUX: "x86_64"
          CIBW_MANYLINUX_X86_64_IMAGE: "manylinux_2_28"
          # Skip musllinux and PyPy
          CIBW_SKIP: "pp* *-musllinux_*"

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: hiredis-ft-linux-wheels
          path: ./wheelhouse/*.whl

  test_freethreading:
    name: Test free-threading compatibility (${{ matrix.python }})
    needs: build_wheels
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.14t", "3.15t"]

    steps:
      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          name: hiredis-ft-linux-wheels
          path: wheelhouse

      - name: Install and test
        run: |
          pip install --no-index --find-links wheelhouse hiredis
          python -c "
          import sys
          print(f'Python: {sys.version}')
          print(f'GIL enabled before import: {sys._is_gil_enabled()}')

          import hiredis
          print(f'hiredis version: {hiredis.__version__}')
          print(f'GIL enabled after import: {sys._is_gil_enabled()}')

          # Test basic functionality
          reader = hiredis.Reader()
          reader.feed(b'+OK\r\n')
          assert reader.gets() == b'OK'

          # Test pack_command
          packed = hiredis.pack_command(('SET', 'key', 'value'))
          assert packed == b'*3\r\n\$3\r\nSET\r\n\$3\r\nkey\r\n\$5\r\nvalue\r\n'

          if sys._is_gil_enabled():
              print('FAILURE: GIL was re-enabled after hiredis import')
              sys.exit(1)
          else:
              print('SUCCESS: GIL remains disabled after hiredis import')
          "

  # Publish the tested wheels as a release so consumers (granian-python wheels/) can pin a
  # permanent, CI-built artifact instead of a local build or a 90-day workflow artifact.
  # Tag = v<package version with + replaced by ->, e.g. 3.5.0+ft1 -> v3.5.0-ft1.
  publish_release:
    name: Publish release
    needs: test_freethreading
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          name: hiredis-ft-linux-wheels
          path: wheelhouse

      - name: Create or replace release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python3 -c "import runpy; print(runpy.run_path('hiredis/version.py')['__version__'])")
          TAG="v${VERSION/+/-}"
          (cd wheelhouse && sha256sum *.whl > SHA256SUMS)
          cat wheelhouse/SHA256SUMS
          gh release delete "$TAG" --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          gh release create "$TAG" wheelhouse/*.whl wheelhouse/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "hiredis $VERSION (free-threading)" \
            --notes "Free-threaded hiredis $VERSION: upstream v${VERSION%%+*} + Py_mod_gil = Py_MOD_GIL_NOT_USED. cp314t / cp315 / cp315t manylinux_2_28 x86_64, built by cibuildwheel 4.3.5 in run $GITHUB_RUN_ID; GIL-off import tested on 3.14t and 3.15t."
